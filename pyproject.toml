[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aic2026"
version = "0.1.0"
description = "AIC 2026 data foundation and multi-encoder retrieval core"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
btc-clip = ["open_clip_torch>=2.24", "torch>=2.2"]
fgclip2 = ["torch>=2.2", "transformers>=4.48"]
pecore = ["torch>=2.5", "torchvision>=0.20", "einops>=0.8", "timm>=1.0"]
faiss = ["faiss-cpu>=1.8"]
refinement = ["opencv-python-headless>=4.9"]
qwen3-vl = ["torch>=2.2", "transformers>=4.57"]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/integration/test_kis_baseline.py" = ["E402"]
